<style>
.vs{position:relative;background:#1c1511}
#stage{position:relative;width:100%;height:calc(100vh - 150px);min-height:520px;max-height:780px;background:#1c1511}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.vs-bar{position:absolute;z-index:5;left:20px;top:18px;right:20px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.vs-tab{pointer-events:auto;padding:10px 18px;font-size:.84rem;font-weight:500;color:#eee;background:rgba(28,21,17,.78);border:1px solid rgba(255,255,255,.18);border-radius:30px;backdrop-filter:blur(6px);transition:.2s}
.vs-tab:hover{background:rgba(70,50,35,.9)}.vs-tab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.vs-note{position:absolute;z-index:5;left:20px;bottom:18px;max-width:420px;font-size:.78rem;color:#e6dac7;background:rgba(28,21,17,.78);padding:10px 14px;border-radius:4px;border-left:3px solid var(--gold);pointer-events:none}
.vs-hint{position:absolute;z-index:5;right:20px;bottom:18px;font-size:.78rem;color:#cdbfa9;pointer-events:none;text-align:right}
#tip{position:absolute;z-index:6;display:none;background:var(--char);color:#fff;font-size:.82rem;padding:7px 12px;border-radius:3px;pointer-events:none;white-space:nowrap;box-shadow:var(--sh2)}
#vsLoad{position:absolute;inset:0;z-index:8;display:grid;place-items:center;color:#d8cbb6;background:#1c1511;font-size:.95rem}
.vs-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.vs-item{display:block;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:.25s}
.vs-item:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.vs-item img{width:100%;aspect-ratio:4/5;object-fit:cover}.vs-item span{display:block;padding:10px 12px;font-size:.88rem;font-weight:500}
.vs-fallback{height:100%;display:grid;place-content:center;text-align:center;color:#fff;gap:14px;padding:30px}
.ring-btn,.ring-name{display:none;position:absolute;z-index:6;border:1px solid rgba(255,255,255,.25);background:rgba(28,21,17,.78);color:#fff;backdrop-filter:blur(6px);cursor:pointer}
.ring-on .ring-btn{display:grid;place-items:center}.ring-on .ring-name{display:block}
.ring-btn{width:46px;height:46px;border-radius:50%;font-size:1.5rem;top:50%;margin-top:-23px}.ring-prev{left:18px}.ring-next{right:18px}.ring-auto{top:auto;bottom:20px;right:20px;margin:0;font-size:.9rem;width:42px;height:42px}
.ring-name{left:50%;bottom:22px;transform:translateX(-50%);padding:11px 22px;border-radius:30px;font-size:.92rem;font-weight:500;background:var(--gold);border-color:var(--gold)}
.ring-on .vs-note,.ring-on .vs-hint{display:none}.hall-note{display:none}.hall-on .vs-note{display:none}.hall-on .hall-note{display:block;max-width:460px}.vs-tab.hall{border-color:var(--gold)}.vs-tab.ring{border-color:var(--gold)}
@media(max-width:820px){#stage{height:68vh}.vs-note{display:none}.vs-tab{padding:8px 13px;font-size:.78rem}}
</style></head>
